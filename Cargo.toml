[package]
name = "moto-buds"
version = "0.1.0"
edition = "2021"
authors = ["shnimlz"]
description = "Control Motorola Moto Buds on Linux (CachyOS)"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
colored = "2.2"
